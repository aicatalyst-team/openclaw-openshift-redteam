[project]
name = "openclaw-isolation-lab"
version = "0.1.0"
description = "OpenClaw isolation lab  -  instrument postmortem and exclusive-posture harness (not an upstream OpenClaw product)."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
]

[project.scripts]
openclaw-lab = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "detectors", "probes", "src/openclaw_redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Documented command is ``uv run pytest -q`` / ``pytest -q``. Without importlib,
# ``from tests.manifests...`` fails collection under uv's default prepend mode.
addopts = "--import-mode=importlib"
