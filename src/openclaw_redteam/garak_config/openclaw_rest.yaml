plugins:
  model_type: rest
  generators:
    rest:
      RestGenerator:
        uri: http://openclaw-gateway:18789/v1/chat/completions
        method: post
        headers:
          Authorization: "Bearer $KEY"
          Content-Type: application/json
        req_template_json_object:
          model: "openclaw:main"
          messages:
            - role: "user"
              content: "$INPUT"
          stream: false
        response_json: true
        response_json_field: "$.choices[0].message.content"
        request_timeout: 120
        key_env_var: OPENCLAW_AUTH_TOKEN
