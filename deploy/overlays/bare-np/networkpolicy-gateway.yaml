# Gateway egress for bare-np (same shape as ssh overlay; SSH rule is inert without sandbox).
# MODEL EGRESS PLACEHOLDER: 203.0.113.0/32 is TEST-NET-3 documentation only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openclaw-gateway-egress
  namespace: openclaw-gateway
  annotations:
    openclaw.isolation/model-egress-placeholder: "203.0.113.0/32"
    openclaw.isolation/model-endpoint: |
      PLACEHOLDER  -  MUST REPLACE before scan.
      ipBlock cidr 203.0.113.0/32 is RFC 5737 TEST-NET-3 (documentation only).
      Set egress CIDR/port for your OpenAI-compatible endpoint, or omit this rule
      if endpoint egress is enforced only at VPC/SG. Preflight fails closed while
      this documentation CIDR is still present on arms that need model egress.
spec:
  podSelector:
    matchLabels:
      app: openclaw
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - port: dns
          protocol: UDP
        - port: dns-tcp
          protocol: TCP
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openclaw-sandbox
          podSelector:
            matchLabels:
              app: sandbox-sshd
      ports:
        - port: 2222
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 203.0.113.0/32
      ports:
        - port: 443
          protocol: TCP
