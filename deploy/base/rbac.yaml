apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw
  namespace: openclaw-gateway
  labels:
    app: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-minimal
  namespace: openclaw-gateway
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rtlab-canary-gateway"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-minimal-binding
  namespace: openclaw-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-minimal
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw-gateway
---
# Boundary probe #4: sandbox pod default SA may read gateway canary ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-canary-configmap-reader
  namespace: openclaw-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openclaw-minimal
subjects:
  - kind: ServiceAccount
    name: default
    namespace: openclaw-sandbox
